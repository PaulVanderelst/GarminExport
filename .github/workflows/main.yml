name: Sync Garmin Activities

on:
  schedule:
    - cron: '0 16-22 * * 1-5'  # Lundi–vendredi, 16h–22h UTC
    - cron: '0 9-20 * * 6,0'   # Samedi–dimanche, 9h–20h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect pandas

      - name: Fetch Garmin activities
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python scripts/fetch_garmin.py

      - name: Commit & push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/activities.csv
          git diff --staged --quiet || git commit -m "chore: update Garmin activities $(date -u +%Y-%m-%d)"
          git push
