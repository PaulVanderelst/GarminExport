name: Sync Garmin Activities

on:
  schedule:
    - cron: '0 16-22 * * 1-5'  # Lundi–vendredi, 16h–22h UTC
    - cron: '0 9-20 * * 6,0'   # Samedi–dimanche, 9h–20h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect pandas

      - name: Fetch Garmin activities
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FLASK_UPLOAD_URL: ${{ secrets.FLASK_UPLOAD_URL }}
        run: python scripts/fetch_garmin.py

      - name: Upload CSV to Flask server
        env:
          FLASK_UPLOAD_URL: ${{ secrets.FLASK_UPLOAD_URL }}
        run: |
          curl -X POST "$FLASK_UPLOAD_URL/upload" \
            -F "file=@data/garmin_activities.csv" \
            --fail-with-body
