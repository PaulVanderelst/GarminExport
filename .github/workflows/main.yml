name: Sync Garmin Activities

on:
  schedule:
    - cron: '0 16-22 * * 1-5'  # Lundi–vendredi, 16h–22h UTC
    - cron: '0 9-20 * * 6,0'   # Samedi–dimanche, 9h–20h UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect pandas

      - name: Fetch Garmin activities
        id: fetch
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          FLASK_UPLOAD_URL: ${{ secrets.FLASK_UPLOAD_URL }}
        run: python scripts/fetch_garmin.py

      # Seulement si une nouvelle activité a été trouvée : évite de renvoyer
      # au serveur le même CSV inchangé à chaque passage (et de rafraîchir à
      # tort la date de dernière synchro affichée sur le site).
      - name: Upload CSV to Flask server
        if: steps.fetch.outputs.nouveau == 'true'
        env:
          FLASK_UPLOAD_URL: ${{ secrets.FLASK_UPLOAD_URL }}
          # Jeton facultatif : même valeur que la variable UPLOAD_TOKEN du site (fichier WSGI).
          # Secret absent ou vide : l'envoi reste accepté tant que le jeton n'est pas activé sur le site, puis il est refusé.
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: |
          curl -X POST "$FLASK_UPLOAD_URL/upload" \
            -H "X-Upload-Token: $UPLOAD_TOKEN" \
            -F "file=@data/garmin_activities.csv" \
            --fail-with-body
